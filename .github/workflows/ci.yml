name: Test synthetic reconciliation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local package
        run: python -m pip install -e .
      - name: Run behavior tests
        run: python -m unittest discover -s tests -v
      - name: Run clean scenario as a strict gate
        run: python -m ops_recon demo --clean --strict --output-dir recon-output/clean

